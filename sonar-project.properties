sonar.projectKey=python-sonar-demo
sonar.projectName=Python Sonar Demo

sonar.sources=.
sonar.exclusions=.venv/**,**/__pycache__/**,.pytest_cache/**,.scannerwork/**
sonar.test.inclusions=test_*.py
sonar.python.version=3.12

# Produced by: pytest --cov --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
